<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Янсон Андрей. {% block lab %}{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css')}}">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
        <link rel="icon" href="{{ url_for('static', filename='favicon-16x16.png') }}">
        <link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}">
        <style>
            body {
                {% if request.cookies.get('color') %}
                color: {{ request.cookies.get('color') }};
                {% endif %}
                
                {% if request.cookies.get('background') %}
                background-color: {{ request.cookies.get('background') }};
                {% endif %}
    
                {% if request.cookies.get('font_size') %}
                font-size: {{ request.cookies.get('font_size') }}px;
                {% endif %}
            }
        </style>
        {% block script %}{% endblock %}
    </head>
    <body>
        <header>
            Web-Программирование, часть 2. {{ self.lab() }}
        </header>

        <main>
            {% block main %}{% endblock %}
        </main>

        <footer>
            &copy; Янсон Андрей, ФБИ-31, 3 курс, 2025
        </footer>
    </body>
</html>
