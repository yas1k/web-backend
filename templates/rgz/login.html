{% extends "base.html" %}

{% block lab %}РГЗ - Вход для кадровика{% endblock %}

{% block main %}
<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    }
    
    h1 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 10px;
        border-bottom: 3px solid #3498db;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #34495e;
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 1em;
        box-sizing: border-box;
    }
    
    .form-group input:focus {
        border-color: #3498db;
        outline: none;
    }
    
    .btn-login {
        width: 100%;
        padding: 14px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1.1em;
        cursor: pointer;
        transition: background 0.3s;
    }
    
    .btn-login:hover {
        background: #2980b9;
    }
    
    .btn-back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #7f8c8d;
        text-decoration: none;
    }
    
    .btn-back:hover {
        color: #3498db;
    }
    
    .error-message {
        background: #fee;
        color: #c0392b;
        padding: 12px;
        border-radius: 5px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
        text-align: center;
    }
</style>

<div class="login-container">
    <h1>Вход для кадровика</h1>
    
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>Логин:</label>
            <input type="text" name="username" required>
        </div>
        
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" name="password" required>
        </div>
        
        <button type="submit" class="btn-login">Войти</button>
        <a href="{{ url_for('rgz.index') }}" class="btn-back">← Вернуться к списку сотрудников</a>
    </form>
</div>
{% endblock %}
